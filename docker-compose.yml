# Іске қосу: cp .env.docker.example .env  →  docker compose up -d --build
services:
  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    environment:
      APP_URL: ${APP_URL:-http://localhost}
      APP_TIMEZONE: ${TIMEZONE:-Asia/Almaty}
      APP_KEY: ${APP_KEY:-}
    volumes:
      - volleyball_data:/data

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    environment:
      SITE_ADDRESS: ${DOMAIN:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  volleyball_data:
  caddy_data:
  caddy_config:
